<svg xmlns="http://www.w3.org/2000/svg" width="352" height="352" viewBox="0 0 128 128"><title>Stonks Sniper circular candlestick scope</title><desc>A pale blue reticle looks through blue-tinted scope glass at a candlestick chart. Clear glass, curved reflections and a layered rim keep the chart visible. The animation searches a square, fires a bullet and smoothly rounds into an equally wide circle over 2.56 seconds. Decorative branding, not market data.</desc><defs><clipPath id="scope"><rect x="5" y="5" width="118" height="118" rx="59.00000"/></clipPath><radialGradient id="glass-depth" cx="46%" cy="36%" r="74%"><stop offset="0" stop-color="#B6CAD6" stop-opacity=".14"/><stop offset=".65" stop-color="#192220" stop-opacity=".30"/><stop offset="1" stop-color="#0A0E0F"/></radialGradient><linearGradient id="glass-reflection" x1="0" y1="0" x2=".35" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".08"/><stop offset=".48" stop-color="#B6CAD6" stop-opacity=".035"/><stop offset="1" stop-color="#B6CAD6" stop-opacity="0"/></linearGradient><radialGradient id="glass-edge" cx="50%" cy="50%" r="55%"><stop offset=".50" stop-color="#0A0E0F" stop-opacity="0"/><stop offset=".84" stop-color="#0A0E0F" stop-opacity=".10"/><stop offset="1" stop-color="#0A0E0F" stop-opacity=".65"/></radialGradient><linearGradient id="glass-glint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".35"/><stop offset=".45" stop-color="#B6CAD6" stop-opacity=".08"/><stop offset="1" stop-color="#B6CAD6" stop-opacity="0"/></linearGradient></defs><rect x="5" y="5" width="118" height="118" rx="59.00000" fill="#0A0E0F"/><rect x="5" y="5" width="118" height="118" rx="59.00000" fill="url(#glass-depth)"/><g clip-path="url(#scope)"><path d="M5 16h118M16 5v118M5 32h118M32 5v118M5 48h118M48 5v118M5 64h118M64 5v118M5 80h118M80 5v118M5 96h118M96 5v118M5 112h118M112 5v118" fill="none" stroke="#192220" stroke-width=".5"/><g id="candles"><path d="M12 71V102" stroke="#8AC8B1" stroke-width="