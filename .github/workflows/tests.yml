name: Tests and Windows prototype

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_provider:
        description: Also exercise actual Yahoo NSE/BSE history (requires network/provider availability)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.13.14"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/windows-requirements.txt
      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libegl1 libopengl0
      - name: Install pinned Windows build dependencies
        if: runner.os == 'Windows'
        run: python -m pip install -e ".[packaging]" -r packaging/windows-requirements.txt
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint, format and type checks
        shell: bash
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy
      - name: Offline regression suite
        run: python -m pytest -q
      - name: Actual NSE and BSE provider tests
        if: github.event_name == 'workflow_dispatch' && inputs.live_provider
        env:
          STONKS_LIVE_TESTS: "1"
        run: python -m pytest tests/test_live_provider.py -q
      - name: Build Windows executable
        if: runner.os == 'Windows'
        run: python scripts/build_windows.py
      - name: Exercise actual packaged runtime
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LIVE_PROVIDER: ${{ github.event_name == 'workflow_dispatch' && inputs.live_provider }}
        run: |
          $env:QT_QPA_PLATFORM = 'windows'
          $env:PYTHONNOUSERSITE = '1'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          if (Test-Path Env:\PYTHONPATH) { Remove-Item Env:\PYTHONPATH }
          if (Test-Path Env:\PYTHONHOME) { Remove-Item Env:\PYTHONHOME }
          $exe = Resolve-Path 'dist\windows-v0.2.0\StonksSniper-0.2.0-windows-x64.exe'
          $report = Join-Path $env:RUNNER_TEMP 'stonks-frozen-smoke.json'
          $arguments = @('--smoke-test', "`"$report`"")
          if ($env:LIVE_PROVIDER -eq 'true') { $arguments += '--live' }
          $process = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru
          if (-not $process.WaitForExit(180000)) { Stop-Process -Id $process.Id; throw 'Frozen runtime timed out' }
          if ($process.ExitCode -ne 0) { throw "Frozen runtime failed: $($process.ExitCode)" }
          $result = Get-Content -Raw -LiteralPath $report | ConvertFrom-Json
          if (-not $result.ok -or -not $result.frozen -or $result.platform_plugin -ne 'windows') {
            throw 'Packaged runtime evidence is invalid'
          }
          if ($env:LIVE_PROVIDER -eq 'true' -and (
            -not $result.network_tested -or -not $result.exported -or
            $result.simulations.Count -ne $result.strategies
          )) { throw 'Packaged live simulations/export were not verified' }
          Get-Content -Raw -LiteralPath $report
      - name: Preserve packaged runtime evidence
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-runtime-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/stonks-frozen-smoke.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload executable and checksums
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-prototype-${{ github.sha }}
          path: dist/windows-v0.2.0/*
          if-no-files-found: error
          retention-days: 14
