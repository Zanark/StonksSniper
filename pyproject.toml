[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stonks-sniper"
dynamic = ["version"]
description = "Local Indian stock-pattern learning and real-data research"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
    "yfinance>=0.2.65,<1",
    "tzdata>=2025.1",
]

[project.optional-dependencies]
packaging = ["pyinstaller>=6.16,<7"]
dev = [
    "build>=1.2,<2",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "Pillow>=11,<13",
]

[project.scripts]
stonks-sniper = "stonks_sniper.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "stonks_sniper.__version__"}

[tool.setuptools.package-data]
stonks_sniper = ["assets/*.svg", "assets/*.txt", "assets/*.gif", "assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/stonks_sniper"]

[[tool.mypy.overrides]]
module = ["yfinance", "yfinance.*"]
ignore_missing_imports = true
