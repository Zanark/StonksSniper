[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stonks-sniper"
version = "0.1.0"
description = "Local Indian stock-pattern learning and real-data research"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
    "yfinance>=0.2.65,<1",
    "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[project.scripts]
stonks-sniper = "stonks_sniper.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stonks_sniper = ["assets/*.svg", "assets/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/stonks_sniper"]

[[tool.mypy.overrides]]
module = ["yfinance", "yfinance.*"]
ignore_missing_imports = true
